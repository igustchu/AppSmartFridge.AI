name: test_app

description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1



environment:

  sdk: ^3.9.2





dependencies:


  flutter_local_notifications: ^19.0.0

  timezone: ^0.10.0


  flutter:

    sdk: flutter





  # Font

  google_fonts: ^6.1.0





  # Image / Camera

  image_picker: ^1.0.7

  permission_handler: ^12.0.3





  # Gemini AI

  google_generative_ai: ^0.4.0





  # HTTP

  http: ^1.2.1





  # Supabase

  supabase_flutter: ^2.12.0





  # Date format

  intl: ^0.20.2





  # iOS icons

  cupertino_icons: ^1.0.8





  # Deep link Reset Password

  app_links: ^6.1.4



  # Icons ที่ดึงมาจาก Figma โดยตรง (ดูไฟล์ lib/widgets/app_icons.dart)

  flutter_svg: ^2.0.10+1







dev_dependencies:


  flutter_test:

    sdk: flutter





  flutter_lints: ^5.0.0







flutter:


  uses-material-design: true

  # ไอคอนที่ export มาจาก Figma โดยตรง (ดูไฟล์ lib/widgets/app_icons.dart)
  assets:
    - assets/icons/

  # ฟอนต์ Inter ตามดีไซน์ Figma — แนบไฟล์มากับแอปโดยตรง (ไม่พึ่งการโหลดจากเน็ต
  # แบบที่ google_fonts ทำตอน runtime) เพื่อให้ฟอนต์ขึ้นตรงชัวร์ๆ ทุกเครื่อง
  # แม้ไม่มีอินเทอร์เน็ตตอนเปิดแอป
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
